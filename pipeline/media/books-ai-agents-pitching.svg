<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI agents that write and pitch their own articles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a24"/>
      <stop offset="1" stop-color="#2a0f47"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7928ca"/>
      <stop offset="1" stop-color="#d59bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- door frame on the right -->
  <g transform="translate(760,96)">
    <rect x="0" y="0" width="300" height="440" rx="12" fill="none" stroke="url(#acc)" stroke-width="6"/>
    <rect x="26" y="26" width="248" height="388" rx="8" fill="#7928ca" opacity="0.18"/>
    <circle cx="238" cy="230" r="13" fill="#d59bff"/>
    <rect x="52" y="60" width="126" height="10" rx="5" fill="#d59bff" opacity="0.35"/>
    <rect x="52" y="86" width="86" height="10" rx="5" fill="#d59bff" opacity="0.22"/>
  </g>
  <!-- knocking arcs -->
  <g transform="translate(724,326)" stroke="#d59bff" fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M0 -54 A 62 62 0 0 1 0 54" opacity="0.8"/>
    <path d="M-30 -80 A 96 96 0 0 1 -30 80" opacity="0.45"/>
    <path d="M-60 -106 A 130 130 0 0 1 -60 106" opacity="0.22"/>
  </g>
  <!-- agent node graph on the left: draft -> pitch envelopes -->
  <g transform="translate(112,150)">
    <circle cx="56" cy="56" r="42" fill="url(#acc)"/>
    <rect x="26" y="42" width="60" height="8" rx="4" fill="#160a24" opacity="0.65"/>
    <rect x="26" y="60" width="40" height="8" rx="4" fill="#160a24" opacity="0.45"/>
    <g stroke="#7928ca" stroke-width="4" opacity="0.75" fill="none">
      <path d="M98 56 H196"/>
      <path d="M98 70 C 160 70 160 196 236 196"/>
      <path d="M98 42 C 160 42 160 -70 236 -70" transform="translate(0,84)"/>
    </g>
    <!-- envelopes -->
    <g transform="translate(200,20)">
      <rect x="0" y="0" width="112" height="76" rx="8" fill="#7928ca" opacity="0.9"/>
      <path d="M0 8 L56 48 L112 8" stroke="#f2e4ff" stroke-width="5" fill="none"/>
    </g>
    <g transform="translate(224,166)" opacity="0.72">
      <rect x="0" y="0" width="112" height="76" rx="8" fill="#7928ca"/>
      <path d="M0 8 L56 48 L112 8" stroke="#f2e4ff" stroke-width="5" fill="none"/>
    </g>
    <g transform="translate(224,-42)" opacity="0.45">
      <rect x="0" y="0" width="112" height="76" rx="8" fill="#7928ca"/>
      <path d="M0 8 L56 48 L112 8" stroke="#f2e4ff" stroke-width="5" fill="none"/>
    </g>
  </g>
  <g transform="translate(112,506)" fill="#f6ecff" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" font-size="46" font-weight="700">AI 에이전트가 문을 두드린다</text>
    <text x="0" y="50" font-size="26" fill="#b98adb">iLands · Jane Friedman</text>
  </g>
  <rect x="0" y="614" width="1200" height="16" fill="#7928ca"/>
</svg>
