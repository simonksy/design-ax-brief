<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NSF puts $380 million into a national network of self-driving labs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1405"/>
      <stop offset="1" stop-color="#31240a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffd58a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- swatch grid: parallel experiment wells, brightening as the search converges -->
  <g transform="translate(92,120)">
    <rect x="0"   y="0"   width="104" height="104" rx="14" fill="url(#acc)"/>
    <rect x="124" y="0"   width="104" height="104" rx="14" fill="#f5a623" opacity="0.70"/>
    <rect x="248" y="0"   width="104" height="104" rx="14" fill="#f5a623" opacity="0.42"/>
    <rect x="372" y="0"   width="104" height="104" rx="14" fill="#f5a623" opacity="0.20"/>

    <rect x="0"   y="124" width="104" height="104" rx="14" fill="#f5a623" opacity="0.55"/>
    <rect x="124" y="124" width="104" height="104" rx="14" fill="url(#acc)"/>
    <rect x="248" y="124" width="104" height="104" rx="14" fill="#f5a623" opacity="0.34"/>
    <rect x="372" y="124" width="104" height="104" rx="14" fill="#f5a623" opacity="0.62"/>

    <rect x="0"   y="248" width="104" height="104" rx="14" fill="#f5a623" opacity="0.24"/>
    <rect x="124" y="248" width="104" height="104" rx="14" fill="#f5a623" opacity="0.48"/>
    <rect x="248" y="248" width="104" height="104" rx="14" fill="url(#acc)"/>
    <rect x="372" y="248" width="104" height="104" rx="14" fill="#f5a623" opacity="0.30"/>

    <!-- the path the machine learner walks between wells -->
    <path d="M52 52 L176 176 L300 300 L424 176" fill="none" stroke="#fff6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
    <circle cx="52"  cy="52"  r="11" fill="#fff6e4"/>
    <circle cx="176" cy="176" r="11" fill="#fff6e4"/>
    <circle cx="300" cy="300" r="11" fill="#fff6e4"/>
    <circle cx="424" cy="176" r="13" fill="#fff6e4"/>
  </g>

  <g transform="translate(636,236)" fill="#fdf1de" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="88" font-weight="700" letter-spacing="-2">$380M</text>
    <text x="0" y="62" font-size="34" font-weight="600" opacity="0.92">SELF-DRIVING LABS</text>
    <rect x="0" y="92" width="196" height="6" rx="3" fill="#f5a623"/>
    <text x="0" y="150" font-size="25" opacity="0.72">NSF · Speed lab · NC State</text>
    <text x="0" y="188" font-size="25" opacity="0.72">years to weeks</text>
  </g>
</svg>
