<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GEO versus SEO for authors and publishers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050e1c"/>
      <stop offset="1" stop-color="#0a1c38"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0070f3"/>
      <stop offset="1" stop-color="#7fc4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0070f3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0070f3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="850" cy="300" r="290" fill="url(#glow)"/>
  <!-- left: SEO ranked result list, fading -->
  <g transform="translate(96,150)" opacity="0.9">
    <rect x="0" y="0" width="360" height="14" rx="7" fill="#0070f3" opacity="0.8"/>
    <rect x="0" y="26" width="248" height="10" rx="5" fill="#0070f3" opacity="0.4"/>
    <rect x="0" y="78" width="320" height="14" rx="7" fill="#0070f3" opacity="0.55"/>
    <rect x="0" y="104" width="212" height="10" rx="5" fill="#0070f3" opacity="0.28"/>
    <rect x="0" y="156" width="286" height="14" rx="7" fill="#0070f3" opacity="0.34"/>
    <rect x="0" y="182" width="180" height="10" rx="5" fill="#0070f3" opacity="0.18"/>
    <rect x="0" y="234" width="240" height="14" rx="7" fill="#0070f3" opacity="0.18"/>
    <rect x="0" y="260" width="150" height="10" rx="5" fill="#0070f3" opacity="0.1"/>
    <text x="0" y="-36" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#4b80bd">S E O</text>
  </g>
  <!-- arrow -->
  <g transform="translate(500,282)" stroke="#0070f3" stroke-width="5" fill="none" opacity="0.7">
    <path d="M0 22 H120"/>
    <path d="M104 6 L124 22 L104 38"/>
  </g>
  <!-- right: GEO single generated answer block -->
  <g transform="translate(664,120)">
    <rect x="0" y="0" width="440" height="286" rx="22" fill="#08152b"/>
    <rect x="0" y="0" width="440" height="286" rx="22" fill="#0070f3" opacity="0.14"/>
    <rect x="0" y="0" width="440" height="286" rx="22" fill="none" stroke="url(#acc)" stroke-width="3"/>
    <rect x="36" y="52" width="300" height="16" rx="8" fill="url(#acc)"/>
    <rect x="36" y="92" width="368" height="12" rx="6" fill="#7fc4ff" opacity="0.55"/>
    <rect x="36" y="122" width="330" height="12" rx="6" fill="#7fc4ff" opacity="0.45"/>
    <rect x="36" y="152" width="352" height="12" rx="6" fill="#7fc4ff" opacity="0.35"/>
    <rect x="36" y="198" width="168" height="14" rx="7" fill="#0070f3"/>
    <circle cx="384" cy="205" r="14" fill="url(#acc)"/>
    <text x="0" y="-30" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#9ed0ff">G E O</text>
  </g>
  <g transform="translate(96,506)" fill="#eaf3ff" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" font-size="46" font-weight="700">AI 답변에 이름을 올리는 법</text>
    <text x="0" y="50" font-size="26" fill="#6ea8e0">Jane Friedman</text>
  </g>
  <rect x="0" y="614" width="1200" height="16" fill="#0070f3"/>
</svg>
