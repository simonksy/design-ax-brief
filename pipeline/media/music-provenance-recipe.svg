<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1c04"/>
      <stop offset="55%" stop-color="#180f02"/>
      <stop offset="100%" stop-color="#0c0801"/>
    </linearGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffe6ac"/>
      <stop offset="40%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#6b4708"/>
    </radialGradient>
    <radialGradient id="node" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- provenance ledger: horizontal metadata rules running the full width -->
  <g stroke="#f5a623" stroke-opacity="0.13" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
  </g>
  <g fill="#f5a623" fill-opacity="0.22">
    <rect x="120" y="134" width="180" height="4" rx="2"/>
    <rect x="360" y="134" width="86" height="4" rx="2"/>
    <rect x="820" y="224" width="240" height="4" rx="2"/>
    <rect x="180" y="314" width="120" height="4" rx="2"/>
    <rect x="900" y="474" width="160" height="4" rx="2"/>
    <rect x="140" y="564" width="210" height="4" rx="2"/>
    <rect x="760" y="654" width="130" height="4" rx="2"/>
  </g>

  <!-- the chain of custody: a signed trail entering the sphere -->
  <g filter="url(#glow)" opacity="0.5">
    <circle cx="600" cy="400" r="210" fill="#f5a623" fill-opacity="0.35"/>
  </g>
  <circle cx="600" cy="400" r="186" fill="url(#orb)"/>
  <circle cx="600" cy="400" r="186" fill="none" stroke="#ffe6ac" stroke-opacity="0.5" stroke-width="1.5"/>
  <ellipse cx="548" cy="342" rx="66" ry="44" fill="#fff6e2" fill-opacity="0.35" filter="url(#soft)" transform="rotate(-24 548 342)"/>

  <!-- provenance path stitched through the sphere -->
  <path d="M 80 620 C 260 600 320 470 470 432 C 560 410 660 392 760 352 C 880 304 980 250 1130 214"
        fill="none" stroke="#ffd27a" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 620 C 260 600 320 470 470 432 C 560 410 660 392 760 352 C 880 304 980 250 1130 214"
        fill="none" stroke="#fff3d6" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round" filter="url(#soft)"/>

  <!-- capture points along the trail: each hand-off leaves a record -->
  <g>
    <circle cx="80" cy="620" r="13" fill="url(#node)"/>
    <circle cx="80" cy="620" r="26" fill="none" stroke="#f5a623" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="470" cy="432" r="16" fill="url(#node)"/>
    <circle cx="470" cy="432" r="32" fill="none" stroke="#f5a623" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="760" cy="352" r="14" fill="url(#node)"/>
    <circle cx="760" cy="352" r="28" fill="none" stroke="#f5a623" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="1130" cy="214" r="11" fill="url(#node)"/>
    <circle cx="1130" cy="214" r="23" fill="none" stroke="#f5a623" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- faint outer rings: the standard that hasn't closed yet -->
  <g fill="none" stroke="#f5a623" stroke-opacity="0.2" stroke-width="1.4">
    <circle cx="600" cy="400" r="262" stroke-dasharray="26 20"/>
    <circle cx="600" cy="400" r="330" stroke-dasharray="6 26"/>
  </g>

  <rect width="1200" height="800" fill="none" stroke="#f5a623" stroke-opacity="0.16" stroke-width="2"/>
</svg>
