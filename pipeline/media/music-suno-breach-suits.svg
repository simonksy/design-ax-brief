<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="78%">
      <stop offset="0%" stop-color="#04262a"/>
      <stop offset="60%" stop-color="#021316"/>
      <stop offset="100%" stop-color="#00080a"/>
    </radialGradient>
    <radialGradient id="orb" cx="34%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#c9fbf7"/>
      <stop offset="42%" stop-color="#2ec5c5"/>
      <stop offset="100%" stop-color="#0a4a4c"/>
    </radialGradient>
    <linearGradient id="shard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9df3ef"/>
      <stop offset="100%" stop-color="#14807f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- the leaked record field: rows of data escaping outward -->
  <g fill="#2ec5c5" fill-opacity="0.16">
    <rect x="60" y="86" width="150" height="6" rx="3"/>
    <rect x="230" y="86" width="64" height="6" rx="3"/>
    <rect x="60" y="118" width="96" height="6" rx="3"/>
    <rect x="176" y="118" width="132" height="6" rx="3"/>
    <rect x="60" y="150" width="176" height="6" rx="3"/>
    <rect x="890" y="640" width="150" height="6" rx="3"/>
    <rect x="890" y="672" width="88" height="6" rx="3"/>
    <rect x="998" y="672" width="118" height="6" rx="3"/>
    <rect x="890" y="704" width="200" height="6" rx="3"/>
    <rect x="60" y="700" width="120" height="6" rx="3"/>
    <rect x="1020" y="118" width="120" height="6" rx="3"/>
  </g>

  <!-- fracture lines cutting the frame -->
  <g stroke="#2ec5c5" stroke-opacity="0.22" stroke-width="1.2">
    <path d="M 0 300 L 330 366 L 470 250 L 600 400"/>
    <path d="M 1200 520 L 900 470 L 760 560 L 600 400"/>
    <path d="M 600 400 L 520 780"/>
    <path d="M 600 400 L 700 40"/>
  </g>

  <!-- the breached sphere -->
  <g filter="url(#glow)" opacity="0.45">
    <circle cx="600" cy="400" r="205" fill="#2ec5c5" fill-opacity="0.4"/>
  </g>
  <path d="M 600 214 A 186 186 0 0 1 600 586 A 186 186 0 0 1 470 530 L 552 452 L 486 388 L 566 356 L 528 288 Z"
        fill="url(#orb)"/>
  <path d="M 600 214 A 186 186 0 0 0 470 530 L 552 452 L 486 388 L 566 356 L 528 288 Z"
        fill="#2ec5c5" fill-opacity="0.12"/>
  <circle cx="600" cy="400" r="186" fill="none" stroke="#9df3ef" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="120 44"/>

  <!-- shards flung out of the sphere: 55.3M records loose -->
  <g fill="url(#shard)" fill-opacity="0.85">
    <polygon points="352,336 424,302 400,378"/>
    <polygon points="276,452 340,436 306,498"/>
    <polygon points="410,566 470,548 442,610"/>
    <polygon points="806,282 872,264 838,326"/>
    <polygon points="900,410 964,398 930,458"/>
    <polygon points="742,600 800,584 770,644"/>
  </g>
  <g fill="#9df3ef" fill-opacity="0.5">
    <polygon points="196,262 234,250 214,292"/>
    <polygon points="1010,606 1048,594 1028,636"/>
    <polygon points="1058,304 1088,296 1072,330"/>
    <polygon points="150,560 182,552 164,588"/>
  </g>

  <!-- two suits: two rings closing in -->
  <g fill="none" stroke="#2ec5c5" stroke-opacity="0.3" stroke-width="1.6">
    <circle cx="600" cy="400" r="286" stroke-dasharray="4 22"/>
    <circle cx="600" cy="400" r="352" stroke-dasharray="4 22"/>
  </g>

  <rect width="1200" height="800" fill="none" stroke="#2ec5c5" stroke-opacity="0.18" stroke-width="2"/>
</svg>
