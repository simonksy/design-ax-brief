<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive · AX-it NOW</title>
<meta name="description" content="AX-it NOW가 지금까지 발행한 모든 AI 뉴스 카드 아카이브">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f1ece4; color: #171717;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

  header { text-align: center; margin-bottom: 22px; }
  .back { display: inline-block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: #171717; text-decoration: none; border: 1px solid #d9d2c6; border-radius: 999px;
    padding: 6px 14px; background: #faf7f1; }
  .back:hover { border-color: #171717; }
  h1 { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600;
    margin: 18px 0 4px; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .count { font-size: 12px; color: #8a8377; font-family: ui-monospace, Menlo, monospace; }

  .controls { position: sticky; top: 0; z-index: 5; background: linear-gradient(#f1ece4 82%, rgba(241,236,228,0)); padding: 10px 0 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .tab { font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .02em;
    border: 1px solid #d9d2c6; background: #faf7f1; color: #57534a; border-radius: 999px;
    padding: 6px 13px; cursor: pointer; }
  .tab:hover { border-color: #a49c8d; }
  .tab.on { background: #171717; border-color: #171717; color: #fff; }
  .search { display: block; width: 100%; max-width: 420px; margin: 0 auto; font-size: 14px;
    font-family: inherit; border: 1px solid #d9d2c6; border-radius: 12px; background: #faf7f1;
    padding: 9px 14px; outline: none; color: #171717; }
  .search:focus { border-color: #171717; }

  .day { margin-top: 26px; }
  .day-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .day-h .d { font-size: 13px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; }
  .day-h .n { font-size: 11.5px; color: #8a8377; }
  .day-h::after { content: ""; flex: 1; border-top: 1px solid #e2dbcf; transform: translateY(-3px); }

  .row { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit;
    background: #faf7f1; border: 1px solid #e6dfd3; border-radius: 16px; padding: 12px; margin-bottom: 8px; }
  .row:hover { border-color: #171717; }
  .thumb { flex: 0 0 92px; width: 92px; height: 66px; border-radius: 10px; object-fit: cover;
    background: #e8e2d6; display: block; }
  .thumb.ph { display: flex; align-items: center; justify-content: center; }
  .thumb.ph::after { content: ""; width: 26px; height: 26px; border-radius: 7px; background: var(--a, #ccc); opacity: .8; }
  .meta { min-width: 0; flex: 1; }
  .chiprow { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .chip { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    font-family: ui-monospace, Menlo, monospace; color: #fff; background: var(--a, #171717);
    border-radius: 999px; padding: 2.5px 8px; }
  .src { font-size: 11px; color: #8a8377; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hl { font-size: 15.5px; font-weight: 700; line-height: 1.35; margin: 1px 0 3px; }
  .bd { font-size: 13px; color: #57534a; line-height: 1.5; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .more, .empty { text-align: center; color: #8a8377; font-size: 13px; padding: 30px 0; }

  /* 뷰 토글 (리스트 ↔ 네트워크) */
  .views { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .view-btn { font-size: 12px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em;
    text-transform: uppercase; border: 1px solid #d9d2c6; background: #faf7f1; color: #57534a;
    border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .view-btn.on { background: #171717; border-color: #171717; color: #fff; }

  /* 네트워크 그래프 — 좌: 그래프 / 우: 카드 패널 */
  #graphwrap { display: none; position: relative; min-width: 0; }
  body.graph-mode #graphwrap { display: flex; gap: 12px; align-items: stretch;
    height: calc(100vh - 235px); min-height: 480px; }
  body.graph-mode #list, body.graph-mode #more, body.graph-mode #empty { display: none; }
  body.graph-mode .wrap { max-width: 1280px; }
  #graph { flex: 1 1 auto; min-width: 0; border: 1px solid #e6dfd3;
    border-radius: 16px; background: #faf7f1; overflow: hidden; position: relative; }
  #graph-hint { position: absolute; left: 12px; right: 424px; bottom: 8px; text-align: center;
    font-size: 11px; color: #8a8377; font-family: ui-monospace, Menlo, monospace;
    pointer-events: none; z-index: 2; }
  @media (max-width: 900px) { #graph-hint { display: none; } }

  /* 우측 패널: 선택 카드 + 1단계 이웃 */
  #side { flex: 0 0 400px; width: 400px; overflow-y: auto; border: 1px solid #e6dfd3;
    border-radius: 16px; background: #faf7f1; padding: 12px; }
  .side-hint { color: #8a8377; font-size: 12px; text-align: center; padding: 14px 8px 12px;
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; }

  /* 메인 카드 — 본 앱 카드 형태의 축약판 */
  .bigcard { background: #fff; border: 1px solid #e6dfd3; border-radius: 16px; overflow: hidden;
    margin-bottom: 14px; }
  .bigcard .bc-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #e8e2d6; }
  .bigcard .bc-ph { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; background: #efe9de; }
  .bigcard .bc-ph::after { content: ""; width: 44px; height: 44px; border-radius: 12px; background: var(--a, #ccc); opacity: .85; }
  .bigcard .bc-body { padding: 13px 15px 15px; }
  .bigcard .bc-eyebrow { display: flex; justify-content: space-between; align-items: center;
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    font-family: ui-monospace, Menlo, monospace; color: #8a8377; margin-bottom: 7px; }
  .bigcard .bc-eyebrow b { color: var(--a, #171717); }
  .bigcard .bc-hl { font-size: 17px; font-weight: 800; line-height: 1.35; margin-bottom: 6px; }
  .bigcard .bc-bd { font-size: 13.5px; color: #57534a; line-height: 1.55; margin-bottom: 12px; }
  .bigcard .bc-read { display: block; text-align: center; background: #171717; color: #fff;
    text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 10px 0; }
  .bigcard .bc-read:hover { opacity: .85; }

  /* 이웃 카드 그리드 (2열, 아카이브 카드 형태) */
  .nbr-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    font-family: ui-monospace, Menlo, monospace; color: #8a8377; margin: 2px 2px 8px; }
  .nbr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ncard { display: block; background: #fff; border: 1px solid #e6dfd3; border-radius: 12px;
    overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; }
  .ncard:hover { border-color: #171717; }
  .ncard .nc-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #e8e2d6; }
  .ncard .nc-ph { width: 100%; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; background: #efe9de; }
  .ncard .nc-ph::after { content: ""; width: 22px; height: 22px; border-radius: 6px; background: var(--a, #ccc); opacity: .85; }
  .ncard .nc-body { padding: 8px 9px 9px; }
  .ncard .nc-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; min-width: 0; }
  .ncard .chip { flex: 0 0 auto; }
  .ncard .nc-src { font-size: 10px; color: #8a8377; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ncard .nc-hl { font-size: 12.5px; font-weight: 700; line-height: 1.35; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ncard .nc-kw { font-size: 10.5px; color: #8a8377; margin-top: 4px;
    font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 호버 툴팁 — 아카이브 카드 형태 */
  .graph-tooltip { padding: 0 !important; background: transparent !important; }
  .tip-card { display: flex; gap: 10px; align-items: flex-start; width: 320px; background: #fff;
    border: 1px solid #e6dfd3; border-radius: 14px; padding: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.10); font-family: Pretendard, sans-serif; color: #171717; }
  .tip-card img, .tip-card .tp-ph { flex: 0 0 76px; width: 76px; height: 56px; border-radius: 8px;
    object-fit: cover; background: #e8e2d6; }
  .tip-card .tp-ph { display: flex; align-items: center; justify-content: center; }
  .tip-card .tp-ph::after { content: ""; width: 20px; height: 20px; border-radius: 6px; background: var(--a, #ccc); opacity: .85; }
  .tip-card .tp-meta { min-width: 0; }
  .tip-card .tp-hl { font-size: 13px; font-weight: 700; line-height: 1.35; margin: 3px 0 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tip-card .tp-bd { font-size: 11.5px; color: #57534a; line-height: 1.45; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  @media (max-width: 900px) {
    body.graph-mode #graphwrap { flex-direction: column; height: auto; }
    #graph { height: 46vh; min-height: 300px; flex: none; }
    #side { flex: none; width: auto; max-height: 60vh; }
  }

  @media (max-width: 560px) {
    .wrap { padding: 20px 12px 60px; }
    .thumb { flex-basis: 72px; width: 72px; height: 54px; }
    .hl { font-size: 14px; }
    .bd { font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">← AX-it NOW</a>
    <h1>Archive</h1>
    <div class="count" id="count"></div>
  </header>
  <div class="controls">
    <div class="views">
      <button class="view-btn on" id="v-list">List</button>
      <button class="view-btn" id="v-graph">Network</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <input class="search" id="q" type="search" placeholder="헤드라인 · 요약 · 매체 검색" autocomplete="off">
  </div>
  <div id="list"></div>
  <div class="more" id="more" hidden>불러오는 중…</div>
  <div class="empty" id="empty" hidden>조건에 맞는 카드가 없습니다.</div>
  <div id="graphwrap">
    <div id="graph"></div>
    <div id="graph-hint">키워드를 공유하는 카드끼리 연결 · 호버=카드 미리보기 · 클릭=우측에 카드 + 연결 뉴스</div>
    <div id="side"><div class="side-hint">노드를 클릭하면 해당 뉴스와<br>직접 연결된 뉴스들이 여기 표시됩니다</div></div>
  </div>
</div>

<script>(function () {
  var v = Date.now();
  document.write('<scr' + 'ipt src="archive-data.js?v=' + v + '"><\/scr' + 'ipt>');
})();</script>
<script>
(function () {
  var ALL = window.AX_ARCHIVE || [];
  var SECTIONS = window.AX_ARCHIVE_SECTIONS || [];
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), moreEl = $("more"), emptyEl = $("empty");

  var present = {};
  ALL.forEach(function (c) { present[c.section] = (present[c.section] || 0) + 1; });

  var state = { sec: "all", q: "" };

  /* 탭 */
  var tabs = [{ key: "all", label: "All" }].concat(
    SECTIONS.filter(function (s) { return present[s.key]; }));
  tabs.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === "all" ? " on" : "");
    b.textContent = t.label;
    b.onclick = function () {
      state.sec = t.key;
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      rebuild();
    };
    $("tabs").appendChild(b);
  });

  var deb;
  $("q").addEventListener("input", function () {
    clearTimeout(deb);
    deb = setTimeout(function () { state.q = $("q").value.trim().toLowerCase(); rebuild(); }, 180);
  });

  function match(c) {
    if (state.sec !== "all" && c.section !== state.sec) return false;
    if (!state.q) return true;
    return ((c.headline || "") + " " + (c.body || "") + " " + (c.source || "") + " " + (c.tool || ""))
      .toLowerCase().indexOf(state.q) !== -1;
  }

  /* 날짜 내림차순 그룹 목록 (데이터는 이미 date desc 정렬) */
  var groups = [], cursor = 0, CHUNK = 12; // 한 번에 12일씩
  function regroup() {
    groups = [];
    var cur = null;
    ALL.forEach(function (c) {
      if (!match(c)) return;
      if (!cur || cur.date !== c.date) { cur = { date: c.date, cards: [] }; groups.push(cur); }
      cur.cards.push(c);
    });
  }

  function kr(d) { return d.replace(/-/g, "."); }

  function renderChunk() {
    var end = Math.min(cursor + CHUNK, groups.length);
    var frag = document.createDocumentFragment();
    for (; cursor < end; cursor++) {
      var g = groups[cursor];
      var day = document.createElement("section");
      day.className = "day";
      var h = document.createElement("div");
      h.className = "day-h";
      h.innerHTML = '<span class="d">' + kr(g.date) + '</span><span class="n">' + g.cards.length + '장</span>';
      day.appendChild(h);
      g.cards.forEach(function (c) {
        var a = document.createElement("a");
        a.className = "row"; a.href = c.url; a.target = "_blank"; a.rel = "noopener";
        a.style.setProperty("--a", c.accent || "#171717");
        var img;
        if (c.image) {
          img = document.createElement("img");
          img.className = "thumb"; img.loading = "lazy"; img.src = "/" + c.image; img.alt = "";
          img.onerror = function () { this.outerHTML = '<div class="thumb ph" style="--a:' + (c.accent || "#ccc") + '"></div>'; };
        } else {
          img = document.createElement("div");
          img.className = "thumb ph";
        }
        var meta = document.createElement("div");
        meta.className = "meta";
        var chip = c.tool || c.section;
        meta.innerHTML =
          '<div class="chiprow"><span class="chip">' + esc(chip) + '</span><span class="src">' + esc(c.source || "") + '</span></div>' +
          '<div class="hl">' + esc((c.headline || "").replace(/\n/g, " ")) + '</div>' +
          '<div class="bd">' + esc(c.body || "") + '</div>';
        a.appendChild(img); a.appendChild(meta);
        day.appendChild(a);
      });
      frag.appendChild(day);
    }
    list.appendChild(frag);
    moreEl.hidden = cursor >= groups.length;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function rebuild() {
    regroup();
    list.innerHTML = ""; cursor = 0;
    emptyEl.hidden = groups.length > 0;
    renderChunk();
    var total = groups.reduce(function (n, g) { return n + g.cards.length; }, 0);
    $("count").textContent = total + " cards · " +
      (groups.length ? kr(groups[groups.length - 1].date) + " – " + kr(groups[0].date) : "");
  }

  /* 무한 스크롤 */
  new IntersectionObserver(function (es) {
    if (es[0].isIntersecting && cursor < groups.length) renderChunk();
  }, { rootMargin: "600px" }).observe(moreEl);

  /* ---- 네트워크 뷰 (지연 로드) — 좌 그래프 + 우 카드 패널 ---- */
  var graphMode = false, graphReady = false, Graph = null, GD = null;
  var nb = {}, adj = {}, hover = null, sel = null;
  var side = document.getElementById("side");

  /* 아카이브 카드 데이터: 노드 id(section/id) → 카드 */
  var CARD = {};
  ALL.forEach(function (c) { CARD[c.section + "/" + c.id] = c; });

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  function nodeMatch(n) {
    if (state.sec !== "all" && n.section !== state.sec) return false;
    if (!state.q) return true;
    return (n.label || "").toLowerCase().indexOf(state.q) !== -1;
  }

  function graphData() {
    var nodes = GD.nodes.filter(nodeMatch);
    var ok = {}; nodes.forEach(function (n) { ok[n.id] = 1; });
    var links = GD.links.filter(function (l) {
      var s = l.source.id || l.source, t = l.target.id || l.target;
      return ok[s] && ok[t];
    }).map(function (l) {
      return { source: l.source.id || l.source, target: l.target.id || l.target, w: l.w, kw: l.kw };
    });
    nb = {}; adj = {};
    links.forEach(function (l) {
      (nb[l.source] = nb[l.source] || {})[l.target] = 1;
      (nb[l.target] = nb[l.target] || {})[l.source] = 1;
      (adj[l.source] = adj[l.source] || []).push({ id: l.target, w: l.w, kw: l.kw });
      (adj[l.target] = adj[l.target] || []).push({ id: l.source, w: l.w, kw: l.kw });
    });
    return { nodes: nodes.map(function (n) { return Object.assign({}, n); }), links: links };
  }

  function withAlpha(hex, a) {
    var n = parseInt((hex || "#888888").slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  /* ---- 우측 패널 렌더 ---- */
  function thumbHTML(c, cls, phCls) {
    if (c.image) {
      return '<img class="' + cls + '" loading="lazy" src="/' + esc(c.image) + '" alt="" ' +
        'onerror="this.outerHTML=\'<div class=&quot;' + phCls + '&quot; style=&quot;--a:' + esc(c.accent || "#ccc") + '&quot;></div>\'">';
    }
    return '<div class="' + phCls + '" style="--a:' + esc(c.accent || "#ccc") + '"></div>';
  }

  function ncardHTML(c, kwList) {
    return '<a class="ncard" data-nid="' + esc(c.section + "/" + c.id) + '" style="--a:' + esc(c.accent || "#171717") + '">' +
      thumbHTML(c, "nc-img", "nc-ph") +
      '<div class="nc-body">' +
        '<div class="nc-meta"><span class="chip">' + esc(c.tool || c.section) + '</span>' +
          '<span class="nc-src">' + esc(kr(c.date)) + " · " + esc(c.source || "") + '</span></div>' +
        '<div class="nc-hl">' + esc((c.headline || "").replace(/\n/g, " ")) + '</div>' +
        (kwList && kwList.length ? '<div class="nc-kw">공유 키워드: ' + esc(kwList.join(", ")) + '</div>' : '') +
      '</div></a>';
  }

  function bindNcards() {
    side.querySelectorAll(".ncard").forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); selectNode(a.getAttribute("data-nid")); };
    });
  }

  function renderSideDefault() {
    var recent = ALL.filter(match).slice(0, 12);
    side.innerHTML =
      '<div class="side-hint">노드를 클릭하면 해당 뉴스와 직접 연결된<br>뉴스들이 여기 표시됩니다 · 아래는 최신 카드</div>' +
      '<div class="nbr-grid">' + recent.map(function (c) { return ncardHTML(c); }).join("") + '</div>';
    bindNcards();
  }

  function renderSideFor(id) {
    var c = CARD[id];
    if (!c) { renderSideDefault(); return; }
    var neighbors = (adj[id] || []).slice().sort(function (a, b) { return b.w - a.w; });
    side.innerHTML =
      '<div class="bigcard" style="--a:' + esc(c.accent || "#171717") + '">' +
        thumbHTML(c, "bc-img", "bc-ph") +
        '<div class="bc-body">' +
          '<div class="bc-eyebrow"><span>AI NEWS · <b>' + esc(c.tool || c.section) + '</b></span>' +
            '<span>' + esc(kr(c.date)) + " · " + esc(c.source || "") + '</span></div>' +
          '<div class="bc-hl">' + esc((c.headline || "").replace(/\n/g, " ")) + '</div>' +
          '<div class="bc-bd">' + esc(c.body || "") + '</div>' +
          '<a class="bc-read" href="' + esc(c.url) + '" target="_blank" rel="noopener">원문 읽기 ↗</a>' +
        '</div></div>' +
      '<div class="nbr-title">직접 연결된 뉴스 ' + neighbors.length + '</div>' +
      (neighbors.length
        ? '<div class="nbr-grid">' + neighbors.map(function (e) {
            var n = CARD[e.id]; return n ? ncardHTML(n, e.kw) : "";
          }).join("") + '</div>'
        : '<div class="side-hint">현재 필터 안에서 연결된 뉴스가 없습니다</div>');
    bindNcards();
    side.scrollTop = 0;
  }

  function selectNode(id) {
    sel = id;
    renderSideFor(id);
    if (Graph) {
      var node = Graph.graphData().nodes.find(function (n) { return n.id === id; });
      if (node && node.x != null) Graph.centerAt(node.x, node.y, 500);
    }
  }

  /* 호버 툴팁 — 아카이브 카드 형태 */
  function tipHTML(n) {
    var c = CARD[n.id];
    if (!c) return esc(n.label);
    return '<div class="tip-card" style="--a:' + esc(c.accent || "#ccc") + '">' +
      (c.image ? '<img src="/' + esc(c.image) + '" alt="">' : '<div class="tp-ph"></div>') +
      '<div class="tp-meta">' +
        '<div class="chiprow"><span class="chip" style="--a:' + esc(c.accent || "#171717") + '">' + esc(c.tool || c.section) + '</span>' +
          '<span class="src">' + esc(kr(c.date)) + " · " + esc(c.source || "") + '</span></div>' +
        '<div class="tp-hl">' + esc((c.headline || "").replace(/\n/g, " ")) + '</div>' +
        '<div class="tp-bd">' + esc(c.body || "") + '</div>' +
      '</div></div>';
  }

  function focusId() { return hover ? hover.id : sel; }

  function initGraph() {
    var el = document.getElementById("graph");
    Graph = ForceGraph()(el)
      .graphData(graphData())
      .nodeId("id")
      .nodeRelSize(3.2)
      .nodeVal(function (n) { return Math.max(1, n.val || 1); })
      .nodeColor(function (n) {
        var f = focusId();
        if (!f) return n.accent || "#8a8377";
        if (n.id === f || (nb[f] && nb[f][n.id])) return n.accent || "#8a8377";
        return "rgba(120,115,105,0.10)";
      })
      .linkColor(function (l) {
        var f = focusId();
        var s = l.source.id || l.source, t = l.target.id || l.target;
        if (f && (s === f || t === f)) {
          var fc = CARD[f];
          return withAlpha(fc && fc.accent, 0.65);
        }
        return "rgba(120,115,105,0.14)";
      })
      .linkWidth(function (l) {
        var f = focusId();
        var s = l.source.id || l.source, t = l.target.id || l.target;
        return (f && (s === f || t === f)) ? 1.8 : 0.8;
      })
      .nodeLabel(tipHTML)
      .onNodeHover(function (n) { hover = n || null; el.style.cursor = n ? "pointer" : "default"; })
      .onNodeClick(function (n) { if (n) selectNode(n.id); })
      .onNodeRightClick(function (n) { var c = n && CARD[n.id]; if (c && c.url) window.open(c.url, "_blank"); })
      .nodeCanvasObjectMode(function () { return "after"; })
      .nodeCanvasObject(function (node, ctx, scale) {
        if (scale < 2.4) return;
        ctx.font = (11 / scale) + "px Pretendard, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillStyle = "#171717";
        ctx.fillText(node.label.slice(0, 24), node.x, node.y + Math.sqrt(Math.max(1, node.val)) * 3.2 / scale + 1.5);
      })
      .backgroundColor("rgba(0,0,0,0)")
      .width(el.clientWidth).height(el.clientHeight)
      .cooldownTicks(120);
    Graph.d3Force("charge").strength(-28);
    Graph.onEngineStop(function () { if (!Graph._fitted) { Graph._fitted = true; Graph.zoomToFit(400, 30); } });
    window.addEventListener("resize", function () {
      if (graphMode) { Graph.width(el.clientWidth).height(el.clientHeight); }
    });
  }

  function enterGraph() {
    graphMode = true;
    document.body.classList.add("graph-mode");
    $("v-graph").classList.add("on"); $("v-list").classList.remove("on");
    if (location.hash !== "#network") history.replaceState(null, "", "#network");
    if (graphReady) {
      Graph._fitted = false;
      Graph.width(document.getElementById("graph").clientWidth)
           .height(document.getElementById("graph").clientHeight);
      Graph.graphData(graphData());
      sel ? renderSideFor(sel) : renderSideDefault();
      return;
    }
    hint("그래프 불러오는 중…");
    Promise.all([loadScript("vendor/force-graph.min.js"),
                 loadScript("archive-graph.js?v=" + Date.now())])
      .then(function () {
        GD = window.AX_GRAPH; graphReady = true; initGraph(); renderSideDefault();
        hint("키워드를 공유하는 카드끼리 연결 · 호버=카드 미리보기 · 클릭=우측에 카드 + 연결 뉴스");
      })
      .catch(function () { hint("그래프 데이터를 불러오지 못했습니다."); });
  }
  function hint(t) { var h = document.getElementById("graph-hint"); if (h) h.textContent = t; }

  function enterList() {
    graphMode = false;
    document.body.classList.remove("graph-mode");
    $("v-list").classList.add("on"); $("v-graph").classList.remove("on");
    if (location.hash === "#network") history.replaceState(null, "", location.pathname);
  }

  $("v-graph").onclick = enterGraph;
  $("v-list").onclick = enterList;

  /* 필터·검색이 그래프·패널에도 반영되게 rebuild 확장 */
  var _rebuild = rebuild;
  rebuild = function () {
    _rebuild();
    if (graphMode && graphReady) {
      hover = null; Graph._fitted = false;
      Graph.graphData(graphData());
      if (sel && !Graph.graphData().nodes.some(function (n) { return n.id === sel; })) sel = null;
      sel ? renderSideFor(sel) : renderSideDefault();
    }
  };

  rebuild();
  if (location.hash === "#network" || location.hash === "#graph") enterGraph();
})();
</script>
</body>
</html>
