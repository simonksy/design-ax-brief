<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AX-it NOW">
  <!-- 지식 그래프에서 가져왔다: 여섯 갈래가 한 노드로 모인다. 갈래 색은 그 그래프가
       쓰는 섹션 색 그대로이고, 색상환을 고르게 돌도록 여섯을 골랐다 — 작은 크기에서
       서로 섞이지 않는다.

       배경판을 두지 않는다. 대신 탭 배경 위에 바로 놓이므로 밝은 탭과 어두운 탭
       양쪽에서 보여야 한다: 섹션 색은 모두 중간 밝기라 둘 다 통과하고, 가운데 노드는
       그래서 중간 회색이다 — 먹색은 어두운 탭에서, 크림은 밝은 탭에서 사라진다.

       갈래 굵기 16·길이 42, 노드 반지름 22. 16px 탭에서 실제 픽셀을 확대해 보고 정한
       값이다. 더 가늘면 색이 흐려지고, 노드가 더 크면 갈래가 돌기처럼 짧아진다. -->
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path stroke="#ff5a4d" d="M50 50 L50.00 8.00"/>   <!-- Gadgets -->
    <path stroke="#f5a623" d="M50 50 L86.37 29.00"/>   <!-- Books -->
    <path stroke="#3aa655" d="M50 50 L86.37 71.00"/>   <!-- Science -->
    <path stroke="#2ec5c5" d="M50 50 L50.00 92.00"/>   <!-- Games -->
    <path stroke="#0070f3" d="M50 50 L13.63 71.00"/>   <!-- Design -->
    <path stroke="#7928ca" d="M50 50 L13.63 29.00"/>   <!-- Movies -->
  </g>
  <circle cx="50" cy="50" r="22" fill="#8e887c"/>
</svg>
